name: FinancialJuice news

on:
  schedule:
    - cron: "7 * * * *"   # hourly, at minute 7 (UTC)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml
      - run: python fj_news.py --self-test
      - run: python fj_news.py
      - name: Commit new headlines
        run: |
          git config user.name "fj-news-bot"
          git config user.email "fj-news-bot@users.noreply.github.com"
          git add reports state
          git diff --cached --quiet || (git commit -m "FinancialJuice headlines $(date -u +%FT%TZ)" && git push)
